apiVersion: apps/v1
kind: Deployment
metadata:
  name: from-discogs
  namespace: mirrorfm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: from-discogs
  template:
    metadata:
      labels:
        app: from-discogs
    spec:
      containers:
        - name: from-discogs
          image: mirrorfm-from-discogs:latest
          imagePullPolicy: Never
          env:
            # SQS-first runner inside the Go binary (mirrors k3s_runner.py).
            # MIN_INTERVAL: pause between successful iterations.
            # SHORT_IDLE: pause when both SQS and cursor have no work.
            - name: MIN_INTERVAL
              value: "1"
            - name: SHORT_IDLE
              value: "5"
          envFrom:
            - secretRef:
                name: from-discogs-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
